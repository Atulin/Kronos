# yaml-language-server: $schema=https://taskfile.dev/schema.json

version: "3"

vars:
  APP_VERSION:
    sh: yq -r '.version' "./pubspec.yaml"

tasks:
  slop: sbx run "ghcr.io/atulin/opencode-sandbox:latest" --kit "ghcr.io/atulin/dart-flutter:latest" .

  release: git tag -a "v{{.APP_VERSION}}" -m "Release v{{.APP_VERSION}}" && git push origin "v{{.APP_VERSION}}"
